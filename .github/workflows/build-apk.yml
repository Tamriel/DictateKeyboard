name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # ⬅️ overrides the default "tools platform-tools"

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Fetch sherpa-onnx native libs
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          tools/fetch-sherpa-onnx.sh

      - name: Build Bergamot native lib
        run: |
          chmod +x tools/bergamot/build-android.sh
          tools/bergamot/build-android.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dictate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
